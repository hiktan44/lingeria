version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fasheone-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: fasheone
      POSTGRES_PASSWORD: fasheone_db_password
      POSTGRES_DB: lingeria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasheone -d lingeria"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fasheone-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data_dev:
