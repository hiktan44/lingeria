version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=fasheone
      - POSTGRES_PASSWORD=fasheone_db_password
      - POSTGRES_DB=lingeria
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=fasheone-secret-key-change-in-production
      - JWT_EXPIRES_IN=24h
      - KIE_API_KEY=dcbf5792e5a6f789a6363f77e092daf4
      - KIE_BASE_URL=https://api.kie.ai
      - ALLOWED_ORIGINS=http://localhost:3001,https://seymata.com
      - GEMINI_API_KEY=
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://backend:4000
      - NEXT_PUBLIC_API_URL=http://backend:4000
    depends_on:
      - backend
