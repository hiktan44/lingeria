version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-fasheone}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fasheone_db_password}
      - POSTGRES_DB=${POSTGRES_DB:-lingeria}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-fasheone-secret-key-change-in-production}
      - JWT_EXPIRES_IN=24h
      - KIE_API_KEY=${KIE_API_KEY:-dcbf5792e5a6f789a6363f77e092daf4}
      - KIE_BASE_URL=https://api.kie.ai
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3001,https://seymata.com}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=${BACKEND_URL:-http://backend:4000}
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://backend:4000}
