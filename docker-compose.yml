version: '3.8'

services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-fasheone}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
      - POSTGRES_DB=${POSTGRES_DB:-lingeria}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be configured}
      - JWT_EXPIRES_IN=24h
      - KIE_API_KEY=${KIE_API_KEY:?KIE_API_KEY must be configured}
      - KIE_BASE_URL=https://api.kie.ai
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3001,https://seymata.com}
