version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fasheone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fasheone
      POSTGRES_PASSWORD: fasheone_db_password
      POSTGRES_DB: lingeria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasheone -d lingeria"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fasheone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fasheone-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://fasheone:fasheone_db_password@postgres:5432/lingeria
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=fasheone
      - POSTGRES_PASSWORD=fasheone_db_password
      - POSTGRES_DB=lingeria
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-fasheone-secret-key-change-in-production}
      - JWT_EXPIRES_IN=24h
      - KIE_API_KEY=${KIE_API_KEY:-dcbf5792e5a6f789a6363f77e092daf4}
      - KIE_BASE_URL=https://api.kie.ai
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3001,https://your-domain.com}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fasheone-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=${BACKEND_URL:-http://localhost:4000}
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://localhost:4000}
    depends_on:
      - backend

volumes:
  postgres_data:
